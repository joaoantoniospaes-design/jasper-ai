<html lang="pt-BR">
<head>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050914;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    padding: 25px 20px;
    text-align: center;
    border-bottom: 1px solid #12304c;
}

header h1 {
    color: #20caff;
    letter-spacing: 5px;
    margin: 5px;
}

header p {
    color: #718ba5;
    font-size: 12px;

.status {
    color: #35e8a5;

}

main {
    padding: 25px 20px;

    margin: auto;
    text-align: center;
}

.core {
    width: 175px;
    height: 175px;
    border-radius: 50%;
    margin: 35px auto;
    background: radial-gradient(circle, #168cc9, #071a38 65%, #050914);
    border: 2px solid #20caff;
    box-shadow: 0 0 35px #087fc9;
    animation: pulse 3s infinite;
}

@keyframes pulse {
    50% {
        box-shadow: 0 0 65px #087fc9;
    }
}

.subtitle {
    color: #8ba9c4;
    margin-bottom: 25px;
}

#chat {
    height: 220px;
    overflow-y: auto;
    border: 1px solid #173650;
    border-radius: 12px;
    padding: 15px;
    text-align: left;
    background: #091322;
    margin-bottom: 15px;
}

.message {
    margin: 12px 0;
    line-height: 1.5;
}

.jarvis {
    color: #20caff;
}

.user {
    color: #ffffff;
}

.input-area {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #17618a;
    background: #101d2d;
    color: white;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px;
    background: #087fc9;
    color: white;
    font-weight: bold;
}

button:active {
    opacity: 0.7;
}

#voice {
    width: 100%;
    margin-top: 12px;
    padding: 16px;
    background: #102d47;
    border: 1px solid #20caff;
}
